name: Build SAAN APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Full Android Project
        run: |
          mkdir -p app/src/main/java/com/saan/oper app/src/main/assets
          if [ -f index.html ]; then cp index.html app/src/main/assets/index.html; fi
          test -f app/src/main/assets/index.html || (echo "ERROR: ارفع ملف index.html في المستودع أولاً" && exit 1)

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SaanFinal"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.saan.oper"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.saan.oper"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.9.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:requestLegacyExternalStorage="true"
                  android:label="SAAN OPER"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/saan/oper/MainActivity.kt
          package com.saan.oper

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.print.PrintAttributes
          import android.print.PrintManager
          import android.provider.Settings
          import android.webkit.*
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.io.File

          class MainActivity : AppCompatActivity() {
              private lateinit var wv: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private var askedPerm = false

              private val picker = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                  val uri = res.data?.data
                  fileCb?.onReceiveValue(if (res.resultCode == RESULT_OK && uri != null) arrayOf(uri) else null)
                  fileCb = null
              }

              private fun backupFile(): File {
                  val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS), "SAAN_Backup")
                  if (!dir.exists()) dir.mkdirs()
                  return File(dir, "saan_db.json")
              }

              private fun hasStoragePerm(): Boolean =
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) Environment.isExternalStorageManager()
                  else ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  wv = WebView(this)
                  setContentView(wv)
                  wv.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      builtInZoomControls = true
                      displayZoomControls = false
                  }
                  wv.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun hasBackupPerm(): Boolean = hasStoragePerm()

                      @JavascriptInterface
                      fun requestBackupPerm() {
                          runOnUiThread {
                              askedPerm = true
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                  startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName")))
                              } else {
                                  ActivityCompat.requestPermissions(this@MainActivity, arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE), 101)
                              }
                          }
                      }

                      @JavascriptInterface
                      fun saveBackup(json: String): Boolean = try {
                          if (!hasStoragePerm()) false else { backupFile().writeText(json, Charsets.UTF_8); true }
                      } catch (_: Exception) { false }

                      @JavascriptInterface
                      fun loadBackup(): String = try {
                          val f = backupFile()
                          if (hasStoragePerm() && f.exists()) f.readText(Charsets.UTF_8) else ""
                      } catch (_: Exception) { "" }

                      @JavascriptInterface
                      fun printHtml(html: String) {
                          runOnUiThread {
                              val pw = WebView(this@MainActivity)
                              pw.webViewClient = object : WebViewClient() {
                                  override fun onPageFinished(view: WebView, url: String) {
                                      val pm = getSystemService(Context.PRINT_SERVICE) as PrintManager
                                      pm.print("SAAN_Report", pw.createPrintDocumentAdapter("SAAN_Report"), PrintAttributes.Builder().build())
                                  }
                              }
                              pw.loadDataWithBaseURL(null, html, "text/html", "UTF-8", null)
                          }
                      }
                  }, "AndroidBridge")

                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(v: WebView?, cb: ValueCallback<Array<Uri>>, p: FileChooserParams?): Boolean {
                          fileCb?.onReceiveValue(null); fileCb = cb
                          picker.launch(Intent(Intent.ACTION_GET_CONTENT).apply { type = "*/*" })
                          return true
                      }
                  }

                  wv.loadUrl("file:///android_asset/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (wv.canGoBack()) wv.goBack() else finish()
                      }
                  })
              }

              override fun onResume() {
                  super.onResume()
                  if (askedPerm && hasStoragePerm()) {
                      askedPerm = false
                      wv.post { wv.evaluateJavascript("window.onAndroidPermGranted && onAndroidPermGranted()", null) }
                  }
              }

              override fun onRequestPermissionsResult(rc: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(rc, p, r)
                  if (rc == 101 && hasStoragePerm()) {
                      askedPerm = false
                      wv.post { wv.evaluateJavascript("window.onAndroidPermGranted && window.onAndroidPermGranted()", null) }
                  }
              }
          }
          EOF

      - uses: uses_setup_java
