const idbRun=(mode,fn)=>new Promise(res=>{try{const req=indexedDB.open('saanDB',1);req.onupgradeneeded=()=>req.result.createObjectStore('kv');req.onsuccess=()=>{const tx=req.result.transaction('kv',mode);fn(tx.objectStore('kv'),res)};req.onerror=()=>res(null)}catch(e){res(null)}});
const idbGet=k=>idbRun('readonly',(st,res)=>{const r=st.get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)});
const idbSet=(k,v)=>idbRun('readwrite',(st,res)=>{const r=st.put(v,k);r.onsuccess=()=>res(true);r.onerror=()=>res(false)});

/* ---------- Core Accounting Helpers ---------- */
const sum=(a,fn)=>a.reduce((x,y)=>x+(+fn(y)||0),0);
const supLedPays=n=>S.led.filter(x=>(x.t=='sup_w'&&x.refName==n)||(x.t=='fine'&&x.refType=='مورد'&&x.refName==n));
const supSt=s=>{
  const m=S.mov.filter(x=>x.c==s.n),b=sum(m.filter(x=>x.t=='شراء'),x=>x.a);
  const p=sum(m.filter(x=>x.t=='سداد'),x=>x.a)+sum(supLedPays(s.n),x=>x.a);
  return{b,p,cur:(+s.open||0)+b-p};
};
const movView=()=>{
  const a=S.mov.map((x,i)=>Object.assign({},x,{_src:'mov',_i:i,pay:x.pay||(x.t=='سداد'?'تحويل':'آجل')}));
  S.led.forEach((x,i)=>{
    if(x.t=='sup_w'&&x.pay=='تحويل')a.push({d:x.d,c:x.refName,t:'سداد',a:x.a,pay:'تحويل (يومية)',note:x.note||'تحويل بنكي من اليومية',_src:'led',_i:i});
    if(x.t=='fine'&&x.refType=='مورد')a.push({d:x.d,c:x.refName,t:'غرامة/مخالفة',a:x.a,pay:x.pay||'خصم',note:x.note||'غرامة مسجلة من اليومية',_src:'led',_i:i});
  });
  return a;
};
const supAllHist=n=>{
  const a=S.mov.filter(x=>x.c==n).map(x=>({d:x.d||'',t:x.t,pay:x.pay||(x.t=='سداد'?'تحويل':'آجل'),a:+x.a||0,note:x.note||''}));
  supLedPays(n).forEach(x=>a.push({d:x.d||'',t:x.t=='fine'?'غرامة ومخالفة':'مسحوبات شركة',pay:x.pay||'كاش',a:+x.a||0,note:(x.note||'')+' (من اليومية)'}));
  return a.sort((x,y)=>(x.d||'9999')>(y.d||'9999')?1:-1);
};
const phSt=p=>{
  const m=S.phm.filter(x=>x.p==p.n),t=(+p.open||0)+sum(m.filter(x=>x.t=='راتب'),x=>x.a);
  const lm=S.led.filter(x=>(x.t=='ph_pay'||(x.t=='fine'&&x.refType=='صيدلي'))&&x.refName==p.n);
  const d=sum(m.filter(x=>x.t=='سداد'),x=>x.a)+sum(lm,x=>x.a);
  const l=[...m.filter(x=>x.t=='سداد').map(x=>x.d),...lm.map(x=>x.d)].filter(Boolean).sort().pop()||'';
  return{t,d,rem:t-d,l};
};
const wkSt=w=>{
  const lm=S.led.filter(x=>(x.t=='wk_adv'||(x.t=='fine'&&x.refType=='عامل'))&&x.refName==w.n);
  const paid=(+w.paid||0)+sum(lm,x=>x.a);
  const last=[w.last,...lm.map(x=>x.d)].filter(Boolean).sort().pop()||'';
  return{sal:+w.sal||0,paid,rem:(+w.sal||0)-paid,last};
};
const wkRem=w=>wkSt(w).rem;

/* ---------- Bank & Cash Flow Engine ---------- */
const LT={sale:'مبيعات',disc:'خصم',ret:'مرتجع',exp:'مصروف عادي',pur:'مشتريات (يدوي)',sup_w:'مسحوبات شركة',wk_adv:'سلفة عامل',ph_pay:'سداد/سلفة صيدلي',fine:'غرامات ومخالفات',yahya:'مسحوبات دكتور يحيى خاص'};
const OUT_TYPES=['exp','pur','sup_w','wk_adv','ph_pay','yahya'];
const isOut=x=>OUT_TYPES.includes(x.t)||(x.t=='fine'&&x.pay!='خصم من الحساب');
function bankCalc(mKey,mode){
  mode=mode||S.bank.mode||'all';
  const open=+(S.bank.open[mKey]||0),td=today();
  const isBankPay=x=>x.pay=='تحويل'||x.k=='بنك'||x.k=='تحويل';
  const lm=S.led.filter(x=>(x.d||'').slice(0,7)==mKey);
  const incAll=sum(lm.filter(x=>x.t=='sale'),x=>x.a)-sum(lm.filter(x=>x.t=='disc'||x.t=='ret'),x=>x.a);
  const incBank=sum(lm.filter(x=>x.t=='sale'&&isBankPay(x)),x=>x.a);
  const incCash=incAll-incBank;
  const outLedAll=sum(lm.filter(isOut),x=>x.a);
  const outLedBank=sum(lm.filter(x=>isOut(x)&&x.pay=='تحويل'),x=>x.a);
  const outLedCash=outLedAll-outLedBank;
  const mm=S.mov.filter(x=>(x.d||'').slice(0,7)==mKey&&x.t=='سداد');
  const outMovBank=sum(mm.filter(x=>x.pay!='كاش'),x=>x.a),outMovCash=sum(mm.filter(x=>x.pay=='كاش'),x=>x.a);
  const pm=S.phm.filter(x=>(x.d||'').slice(0,7)==mKey&&x.t=='سداد');
  const outPhBank=sum(pm.filter(x=>x.pay!='كاش'),x=>x.a),outPhCash=sum(pm.filter(x=>x.pay=='كاش'),x=>x.a);
  const inUsed=mode=='bank'?incBank:incAll;
  const outUsed=mode=='bank'?(outLedBank+outMovBank+outPhBank):(outLedAll+outMovBank+outMovCash+outPhBank+outPhCash);
  const tdLed=S.led.filter(x=>x.d==td),tdMov=S.mov.filter(x=>x.d==td&&x.t=='سداد'),tdPh=S.phm.filter(x=>x.d==td&&x.t=='سداد');
  const paidToday=(mode=='bank'
    ?sum(tdLed.filter(x=>isOut(x)&&x.pay=='تحويل'),x=>x.a)+sum(tdMov.filter(x=>x.pay!='كاش'),x=>x.a)+sum(tdPh.filter(x=>x.pay!='كاش'),x=>x.a)
    :sum(tdLed.filter(isOut),x=>x.a)+sum(tdMov,x=>x.a)+sum(tdPh,x=>x.a));
  const nowBal=open+inUsed-outUsed;
  return{open,inUsed,outUsed,nowBal,endBal:nowBal,paidToday,incBank,incCash,outBank:outLedBank+outMovBank+outPhBank,outCash:outLedCash+outMovCash+outPhCash,mode};
}

function gsr(q){
  q=q.trim().toLowerCase();const g=$('#gr');if(!q){g.style.display='none';return}
  const R=[],add=(t,p,o,s)=>{if(JSON.stringify(o).toLowerCase().includes(q)&&can(p))R.push([t,p,s])};
  S.sup.forEach(s=>add('شركة','sup',s,`${s.n} ${s.rep} | المديونية ${f(supSt(s).cur)}`));
  movView().forEach(x=>add('حركة مورد','mov',x,`${x.d} ${x.c} ${x.t} (${x.pay}) ${f(x.a)}`));
  S.ph.forEach(s=>add('صيدلي','ph',s,`${s.n} | المتبقي ${f(phSt(s).rem)}`));
  S.wk.forEach(s=>add('عامل','wk',s,`${s.n} | المتبقي ${f(wkRem(s))}`));
  S.emp.forEach(s=>add('موظف','emp',s,`${s.n} - ${s.job} ${s.tel}`));
  S.led.forEach(x=>add('يومية','led',x,`${x.d} ${LT[x.t]||x.t} ${x.refName||x.k} (${x.pay||'كاش'}) ${f(x.a)}`));
  g.innerHTML=R.slice(0,40).map(r=>`<div onclick="go('${r[1]}',$('#gq').value.trim())"><i>${r[0]}</i>${E(r[2])}</div>`).join('')||'<div>لا توجد نتائج</div>';
  g.style.display='block';
}

function bankBudgetHtml(mKey){
  const bk=bankCalc(mKey),lm=S.led.filter(x=>(x.d||'').slice(0,7)==mKey),st=S.pl.stock[mKey]||{},inv=+(st.close??st.open??0);
  const supCur=sum(S.sup,s=>supSt(s).cur),phRem=sum(S.ph,p=>phSt(p).rem),wkR=sum(S.wk,wkRem);

    const M2=[['cash','sale','كاش','كاش'],['tr','sale','تحويل','تحويل'],['bank','sale','بنك','تحويل'],['disc','disc','خصم','كاش'],['ret','ret','مرتجع','كاش'],['rent','exp','الإيجار','كاش'],['sal','exp','الرواتب','كاش'],['elec','exp','ماء وكهرباء','كاش'],['net','exp','إنترنت','كاش'],['reg','exp','تسجيل مدير','كاش'],['misc','exp','نثريات','كاش'],['yahya','yahya','مسحوبات دكتور يحيى خاص','كاش'],['fine','fine','غرامات ومخالفات','كاش'],['oth','exp','أخرى','كاش']];

/* ---------- Profit & Loss (P&L) ---------- */
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ym=(y,i)=>y+'-'+String(i+1).padStart(2,'0'),cu=()=>S.pl.cur||'ر.س';
function plCalc(y){
  const R=[],c=S.pl,now=new Date(),cm=ym(now.getFullYear(),now.getMonth());let pc=null;
  for(let i=0;i<12;i++){
    const k=ym(y,i),L=S.led.filter(x=>(x.d||'').slice(0,7)==k),g=(t,n)=>sum(L.filter(x=>x.t==t&&(!n||x.k==n)),x=>x.a),st=S.pl.stock[k]||{};
    const o={m:i,sales:g('sale'),disc:g('disc'),ret:g('ret')};
    o.open=pc!=null?pc:(+st.open||0);o.close=(st.close===undefined||st.close==='')?null:+st.close;if(o.close!=null)pc=o.close;
    o.pur=(c.lkPur=='نعم'?sum(S.mov.filter(x=>x.t=='شراء'&&(x.d||'').slice(0,7)==k),x=>x.a):0)+g('pur');
    o.rent=g('exp','الإيجار');
    o.sal=g('exp','الرواتب')+(c.lkPh=='نعم'?sum(S.phm.filter(x=>x.t=='راتب'&&(x.d||'').slice(0,7)==k),x=>x.a):0)+(c.lkWk=='نعم'&&k==cm?sum(S.wk,w=>w.sal):0);
    o.elec=g('exp','ماء وكهرباء');o.net=g('exp','إنترنت');o.reg=g('exp','تسجيل مدير');o.misc=g('exp','نثريات');
    o.fine=sum(L.filter(x=>x.t=='fine'&&x.refType=='عامة'),x=>x.a);
    o.oth=sum(L.filter(x=>x.t=='exp'&&!EC.includes(x.k)),x=>x.a)+o.fine;
    o.yahya=g('yahya');
    R.push(fin(o,c));
  }
  const T={m:12};['sales','disc','ret','pur','rent','sal','elec','net','reg','misc','oth','yahya'].forEach(k=>T[k]=sum(R,x=>x[k]));
  T.open=R[0].open;T.close=[...R].reverse().map(x=>x.close).find(x=>x!=null)??null;
  ['ns','cogs','gp','opx','op','dep','pa','tax','pt','mg','np'].forEach(k=>T[k]=sum(R,x=>x[k]));
  T.gpp=T.ns?T.gp/T.ns:0;T.npp=T.ns?T.np/T.ns:0;T.avg=T.ns/(12*(+c.days||30));R.push(T);return R;
}
function fin(o,c){
  o.ns=o.sales-o.disc-o.ret;o.cogs=o.close==null?0:o.open+o.pur-o.close;o.gp=o.ns-o.cogs;o.gpp=o.ns?o.gp/o.ns:0;
  o.opx=o.rent+o.sal+o.elec+o.net+o.reg+o.misc+o.oth;o.op=o.gp-o.opx;
  o.dep=o.ns==0?0:(+c.eq||0)/((+c.life)||1)/12;o.pa=o.op-o.dep;o.tax=Math.max(0,o.pa)*(+c.tax||0)/100;o.pt=o.pa-o.tax;
  o.mg=o.ns==0?0:(+c.mgr||0);o.np=o.pt-o.mg;o.npp=o.ns?o.np/o.ns:0;o.avg=o.ns/((+c.days)||30);return o;
}
const PR=[['إجمالي المبيعات','sales','in'],['الخصومات','disc','in'],['المرتجعات','ret','in'],['مخزون أول المدة','open','st'],['مشتريات الفترة (من الموردين)','pur','in'],['مخزون آخر المدة','close','st'],['الإيجار','rent','in'],['الرواتب (صيادلة وعمال)','sal','in'],['ماء وكهرباء','elec','in'],['إنترنت','net','in'],['تسجيل مدير','reg','in'],['نثريات','misc','in'],['مصروفات أخرى وغرامات عامة','oth','in'],['صافي المبيعات','ns','c'],['تكلفة البضاعة المباعة COGS','cogs','c'],['مجمل الربح','gp','c'],['نسبة مجمل الربح %','gpp','p'],['إجمالي مصاريف التشغيل','opx','c'],['الربح التشغيلي','op','c'],['إهلاك المعدات','dep','c'],['الربح بعد الإهلاك','pa','c'],['الضريبة','tax','c'],['الربح بعد الضريبة','pt','c'],['راتب المدير / مصروف البيت','mg','c'],['صافي الربح Net Profit','np','c'],['نسبة صافي الربح %','npp','p'],['مسحوبات دكتور يحيى خاص (معلومة)','yahya','in'],['متوسط المبيعات اليومي','avg','c']];
function plTbl(y){const R=plCalc(y),h=['البند',...MN,'الإجمالي السنوي'];const rows=PR.map(([l,k,ty])=>[`<span style="${ty=='c'?'font-weight:700':''}">${l}</span>`,...R.map(o=>{const v=o[k];if(v==null)return'';if(ty=='p')return(v*100).toFixed(1)+'%';return k=='np'||k=='op'||k=='gp'?`<b class="${v<0?'neg':''}">${f(Math.round(v))}</b>`:ty=='c'?`<b>${f(Math.round(v))}</b>`:f(Math.round(v))})]);return{R,html:`<div class="wide pl">${TB(h,rows)}</div>`}}

function plS(){form('إعدادات الأرباح',[['cur','العملة'],['eq','تكلفة المعدات','number'],['life','العمر الافتراضي (سنة)','number'],['tax','الضريبة %','number'],['mgr','راتب المدير الشهري','number'],['days','أيام الشهر','number'],['lkPur','ربط المشتريات بالموردين','sel',['نعم','لا']],['lkPh','ربط الرواتب بالصيادلة','sel',['نعم','لا']],['lkWk','ربط الرواتب بالعمال','sel',['نعم','لا']]],S.pl,o=>{Object.assign(S.pl,o)})}

/* ---------- Calculator & Clock ---------- */
function calc(){modal(`<h3>الآلة الحاسبة</h3><input id="cd" onkeydown="if(event.key=='Enter')cE()"><div class="calc">${['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','⌫','='].map(k=>`<button class="${'/*-+='.includes(k)?'o':''}" onclick="cK('${k}')">${k=='*'?'×':k=='/'?'÷':k}</button>`).join('')}</div><div style="margin-top:8px"><button class="b g" onclick="mClose()">إغلاق</button></div>`);setTimeout(()=>$('#cd').focus(),50)}
function cK(k){const d=$('#cd');if(k=='C')d.value='';else if(k=='⌫')d.value=d.value.slice(0,-1);else if(k=='=')cE();else d.value+=k}
function cE(){const d=$('#cd');try{if(!/^[0-9+\-*/.() ]+$/.test(d.value))throw 0;d.value=+(Function('return '+d.value)()).toFixed(6)}catch(e){d.value='خطأ'}}
function tick(){const n=new Date();$('#clk').innerHTML=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}).replace(/ (AM|PM)/,'<small> $1</small>');$('#dt').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
setInterval(tick,10000);tick();
document.addEventListener('keydown',e=>{if(!U)return;if(e.key=='Escape')mClose();if(e.key=='F2'){e.preventDefault();$('#gq').focus();return}if(!e.altKey)return;const c=e.code.replace('Key','');if(c=='F'){e.preventDefault();$('#gq').focus()}else if(c=='C'){e.preventDefault();calc()}else if(c=='Q'){e.preventDefault();logout()}else{const p=Object.keys(SK).find(k=>SK[k]==c);if(p){e.preventDefault();go(p)}}});
renderLoginBk();
try{const su=sessionStorage.getItem('saan_u');const u=S.users.find(x=>x.u==su);if(u){U=u;start()}}catch(e){}
